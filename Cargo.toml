[package]
name = "tuf-rgb"
version = "0.1.0"
edition = "2024"
description = "Open-source keyboard lighting control for ASUS TUF laptops (asus-wmi TUF RGB interface)"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
eframe = { version = "0.29", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[[bin]]
name = "tuf-rgb"
path = "src/bin/tuf-rgb.rs"

[[bin]]
name = "tuf-rgbd"
path = "src/bin/tuf-rgbd.rs"

[[bin]]
name = "tuf-rgb-gui"
path = "src/bin/tuf-rgb-gui.rs"
required-features = ["gui"]

[profile.release]
lto = true
